<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>duplexity-3d</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0d10;
        color: #d8dde3;
        font: 14px/1.4 system-ui, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #hud {
        position: fixed;
        left: 12px;
        top: 12px;
        z-index: 2;
        pointer-events: none;
        text-shadow: 0 1px 2px #000;
      }
      #hud b {
        color: #ffd479;
      }
      #gate {
        color: #7fd39b;
      }
      #ride {
        color: #8fd0ff;
      }
      #blueprint {
        position: fixed;
        right: 12px;
        top: 12px;
        z-index: 2;
        border-radius: 8px;
        border: 1px solid rgba(159, 180, 194, 0.25);
        pointer-events: none;
      }
      #loader {
        position: fixed;
        inset: 0;
        z-index: 5;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: radial-gradient(120% 90% at 50% 40%, #10161f 0%, #05070a 70%);
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #7fe4f2;
        transition: opacity 0.35s ease;
      }
      #loader.gone {
        opacity: 0;
        pointer-events: none;
      }
      #loader h1 {
        margin: 0;
        font-size: 15px;
        letter-spacing: 0.4em;
        color: #d8e8ef;
      }
      #bar {
        width: min(320px, 60%);
        height: 2px;
        background: rgba(127, 228, 242, 0.18);
        overflow: hidden;
      }
      #bar i {
        display: block;
        height: 100%;
        width: 0;
        background: #2ad4e6;
        box-shadow: 0 0 10px #2ad4e6;
        transition: width 0.25s ease;
      }
      #step {
        color: #5f8494;
        text-transform: none;
        letter-spacing: 0.08em;
      }
      #prompt {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 2;
        padding: 10px 16px;
        background: rgba(0, 0, 0, 0.55);
        border-radius: 8px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div><span id="place">-</span> - <span id="room">-</span></div>
      <div>WASD move, <b>shift</b> run, <b>space</b> jump, right button zooms. <b>E</b> talks.</div>
      <div id="next"></div>
      <div id="ride"></div>
      <div id="gate"></div>
      <div id="status"></div>
    </div>
    <canvas id="blueprint" width="220" height="220"></canvas>
    <div id="prompt">click to play</div>
    <div id="loader">
      <h1>duplexity</h1>
      <div id="bar"><i></i></div>
      <div id="step">starting</div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
