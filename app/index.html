<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>doplexity-3d - runtime slice</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0d10;
        color: #d8dde3;
        font: 14px/1.4 system-ui, sans-serif;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #hud {
        position: fixed;
        left: 12px;
        top: 12px;
        z-index: 2;
        pointer-events: none;
        text-shadow: 0 1px 2px #000;
      }
      #hud b {
        color: #ffd479;
      }
      #prompt {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 2;
        padding: 10px 16px;
        background: rgba(0, 0, 0, 0.55);
        border-radius: 8px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div>doplexity-3d runtime slice - <span id="room">-</span></div>
      <div>WASD move, mouse look, <b>E</b> to talk to a nearby NPC, reach the <b>amulet</b> to win.</div>
      <div id="status"></div>
    </div>
    <div id="prompt">click to play</div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
